name: Package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/validate.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/validate.py
      - name: Windows isolated core checks
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File skills/claude-code-setup/windows/tests/Test-Core.ps1
